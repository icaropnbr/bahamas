<!DOCTYPE html>

    <title>Bahamas East Village - Moradores</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="favicon.png">
    <style>
        :root {
            --azul-oceano: #0077b6;
            --azul-claro: #90e0ef;
            --areia: #f2e9d2;
            --areia-escura: #e9c46a;
            --texto: #264653;
            --branco: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--areia);
            color: var(--texto);
            padding-bottom: 50px;
        }

        header {
            background: linear-gradient(135deg, var(--azul-oceano), var(--azul-claro));
            color: white;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header p {
            font-weight: 300;
            opacity: 0.9;
        }

        .search-container {
            max-width: 600px;
            margin: -25px auto 30px auto;
            padding: 0 20px;
        }

        #searchInput {
            width: 100%;
            padding: 15px 25px;
            border-radius: 30px;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-size: 1rem;
            outline: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .house-card {
            background-color: var(--branco);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, border 0.3s ease;
            border-bottom: 5px solid var(--areia-escura);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .house-card:hover {
            transform: translateY(-5px);
            border-bottom: 5px solid var(--azul-oceano);
        }

        .house-number {
            background-color: var(--azul-oceano);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .resident-list {
            list-style: none;
            width: 100%;
        }

        .resident-item {
            padding: 5px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.95rem;
        }

        .resident-item:last-child {
            border-bottom: none;
        }

        .unknown {
            color: #999;
            font-style: italic;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.8rem; }
            .container { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>

                <ul class="resident-list">
                    ${moradoresHTML}
                </ul>
            `;
            grid.appendChild(card);
        });

    });
