<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahamas East Village - Moradores</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="favicon.png">
    <style>
        :root {
            --azul-oceano: #0077b6;
            --azul-claro: #90e0ef;
            --areia: #f2e9d2;
            --areia-escura: #e9c46a;
            --texto: #264653;
            --branco: #ffffff;
            --sucesso: #2a9d8f;
            --erro: #e76f51;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--areia);
            color: var(--texto);
            padding-bottom: 50px;
        }

        /* Ícone Secreto no Canto Superior Esquerdo */
        .secret-admin-btn {
            position: fixed;
            top: 8px;
            left: 8px;
            background: transparent;
            border: none;
            color: var(--branco);
            font-size: 1.2rem;
            opacity: 0.15; /* Quase invisível */
            cursor: pointer;
            z-index: 999;
            transition: opacity 0.3s, transform 0.2s;
            padding: 5px;
        }

        .secret-admin-btn:hover {
            opacity: 0.9;
            transform: scale(1.1);
        }

        header {
            background: linear-gradient(135deg, var(--azul-oceano), var(--azul-claro));
            color: white;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header p {
            font-weight: 300;
            opacity: 0.9;
        }

        .search-container {
            max-width: 600px;
            margin: -25px auto 30px auto;
            padding: 0 20px;
        }

        #searchInput {
            width: 100%;
            padding: 15px 25px;
            border-radius: 30px;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-size: 1rem;
            outline: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .house-card {
            background-color: var(--branco);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, border 0.3s ease;
            border-bottom: 5px solid var(--areia-escura);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .house-card:hover {
            transform: translateY(-5px);
            border-bottom: 5px solid var(--azul-oceano);
        }

        .house-number {
            background-color: var(--azul-oceano);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .resident-list {
            list-style: none;
            width: 100%;
        }

        .resident-item {
            padding: 5px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.95rem;
        }

        .resident-item:last-child {
            border-bottom: none;
        }

        .unknown {
            color: #999;
            font-style: italic;
        }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }

        .modal-box {
            background: var(--branco);
            width: 90%;
            max-width: 480px;
            border-radius: 15px;
            padding: 25px 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border-top: 6px solid var(--azul-oceano);
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-box h2 {
            margin-bottom: 15px;
            color: var(--azul-oceano);
            font-size: 1.4rem;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--azul-oceano);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }
        .btn-cancel { background: #e5e7eb; color: #374151; }
        .btn-confirm { background: var(--azul-oceano); color: white; }

        .config-link {
            display: block;
            margin-top: 15px;
            font-size: 0.8rem;
            color: #6b7280;
            text-align: center;
            text-decoration: underline;
            cursor: pointer;
        }

        #configSection {
            display: none;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.85rem;
            border: 1px dashed #cbd5e1;
        }

        #statusMsg {
            margin-top: 10px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
        }
    </style>
</head>

<!-- Ícone Discreto no Canto Superior Esquerdo -->
<button id="btnSecretAdmin" class="secret-admin-btn" title="Área Restrita">⚙️</button>

<header>
    <h1>Bahamas East Village</h1>
    <p>Diretório de Moradores e Residências</p>
</header>

<div class="search-container">
    <input type="text" id="searchInput" placeholder="Pesquisar morador ou número da casa...">
</div>

<div class="container" id="gridMoradores"></div>

<!-- MODAL DE CADASTRO -->
<div class="modal-overlay" id="modalAdmin">
    <div class="modal-box">
        <h2>Adicionar Morador</h2>

        <form id="adminForm">
            <div class="form-group">
                <label for="inputNome">Nome:</label>
                <input 
                    type="text" 
                    id="inputNome" 
                    placeholder="Digite o nome completo" 
                    required 
                    autocomplete="off"
                    pattern="^[A-Za-zÀ-ÖØ-öø-ÿ\s]+$"
                    title="Apenas letras e espaços são permitidos.">
            </div>

            <div class="form-group">
                <label for="inputCasa">Núm. Casa:</label>
                <input 
                    type="number" 
                    id="inputCasa" 
                    placeholder="Número da unidade" 
                    min="1" 
                    step="1" 
                    required>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-cancel" id="btnCancel">Cancelar</button>
                <button type="submit" class="btn btn-confirm" id="btnConfirm">Confirmar</button>
            </div>
        </form>

        <div id="statusMsg"></div>

        <span class="config-link" id="toggleConfig">⚙️ Configurar sincronização direta com GitHub</span>
        <div id="configSection">
            <p style="margin-bottom:8px;">Para salvar para todos sem subir arquivo manual:</p>
            <input type="text" id="ghRepo" placeholder="usuario/repositorio (ex: joao/bahamas)" style="margin-bottom:6px; width:100%; padding:6px; font-size:0.8rem;">
            <input type="password" id="ghToken" placeholder="GitHub Personal Access Token (PAT)" style="width:100%; padding:6px; font-size:0.8rem;">
            <button type="button" id="btnSaveConfig" style="margin-top:6px; width:100%; padding:6px; font-size:0.8rem; cursor:pointer;">Salvar Configuração</button>
        </div>
    </div>
</div>

    // Carregar do localStorage se houver dados salvos previamente
    const dadosSalvos = localStorage.getItem('bahamas_moradores');
    if (dadosSalvos) {
        dados = JSON.parse(dadosSalvos);
    }

    const grid = document.getElementById('gridMoradores');
    const searchInput = document.getElementById('searchInput');

    function renderCards(filtro = "") {
        grid.innerHTML = "";
        
        const dadosFiltrados = dados.filter(item => {
            const busca = filtro.toLowerCase();
            const casaMatch = item.casa.toString().includes(busca);
            const moradorMatch = item.moradores.some(m => m.toLowerCase().includes(busca));
            return casaMatch || moradorMatch;
        });

        dadosFiltrados.forEach(item => {
            const card = document.createElement('div');
            card.className = 'house-card';
            
            let moradoresHTML = item.moradores.map(m => {
                const classe = m === "??" ? "unknown" : "";
                const nome = m === "??" ? "A identificar" : m;
                return `<li class="resident-item ${classe}">${nome}</li>`;
            }).join('');

            card.innerHTML = `
                <div class="house-number">${item.casa}</div>
                <ul class="resident-list">
                    ${moradoresHTML}
                </ul>
            `;
            grid.appendChild(card);
        });
    }

    searchInput.addEventListener('input', (e) => {
        renderCards(e.target.value);
    });

    renderCards();

    // --- CONTROLE DO MODAL ---
    const btnSecretAdmin = document.getElementById('btnSecretAdmin');
    const modalAdmin = document.getElementById('modalAdmin');
    const btnCancel = document.getElementById('btnCancel');
    const adminForm = document.getElementById('adminForm');
    const inputNome = document.getElementById('inputNome');
    const inputCasa = document.getElementById('inputCasa');
    const statusMsg = document.getElementById('statusMsg');

    btnSecretAdmin.addEventListener('click', () => {
        modalAdmin.style.display = 'flex';
        inputNome.value = '';
        inputCasa.value = '';
        inputNome.focus();
    });

    btnCancel.addEventListener('click', () => {
        modalAdmin.style.display = 'none';
        statusMsg.style.display = 'none';
    });

    // Filtros de digitação: Apenas letras no nome
    inputNome.addEventListener('keypress', (e) => {
        if (!/^[A-Za-zÀ-ÖØ-öø-ÿ\s]$/.test(e.key)) {
            e.preventDefault();
        }
    });

    // Apenas inteiros positivos na casa
    inputCasa.addEventListener('keydown', (e) => {
        if (['-', '+', 'e', 'E', '.', ','].includes(e.key)) {
            e.preventDefault();
        }
    });

    // Submissão do formulário
    adminForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const nome = inputNome.value.trim();
        const numCasa = parseInt(inputCasa.value, 10);

        if (!nome || isNaN(numCasa) || numCasa <= 0) return;

        // Atualizar lista em memória
        const casaObj = dados.find(item => item.casa === numCasa);
        if (casaObj) {
            const indexInterrogacao = casaObj.moradores.indexOf("??");
            if (indexInterrogacao !== -1) {
                casaObj.moradores[indexInterrogacao] = nome;
            } else {
                casaObj.moradores.push(nome);
            }
        } else {
            dados.push({ casa: numCasa, moradores: [nome] });
            dados.sort((a, b) => a.casa - b.casa);
        }

        // Salvar em localStorage
        localStorage.setItem('bahamas_moradores', JSON.stringify(dados));
        renderCards(searchInput.value);

        // Se houver token GitHub configurado, envia o commit automático!
        const ghToken = localStorage.getItem('bahamas_gh_token');
        const ghRepo = localStorage.getItem('bahamas_gh_repo');

        if (ghToken && ghRepo) {
            statusMsg.style.display = 'block';
            statusMsg.style.color = '#0077b6';
            statusMsg.textContent = 'Enviando alteração direta para o GitHub...';

            try {
                await syncToGitHub(ghRepo, ghToken, dados);
                statusMsg.style.color = 'green';
                statusMsg.textContent = 'Atualizado com sucesso no GitHub!';
                setTimeout(() => { modalAdmin.style.display = 'none'; statusMsg.style.display = 'none'; }, 1500);
            } catch (err) {
                statusMsg.style.color = 'red';
                statusMsg.textContent = 'Salvo localmente, mas erro no GitHub: ' + err.message;
            }
        } else {
            modalAdmin.style.display = 'none';
        }
    });

    // Sincronização via API do GitHub
    async function syncToGitHub(repo, token, novosDados) {
        const filePath = 'index.html';
        const url = `https://api.github.com/repos/${repo}/contents/${filePath}`;
        
        // 1. Obter o SHA do arquivo atual
        const fileRes = await fetch(url, {
            headers: { 'Authorization': `token ${token}` }
        });
        if (!fileRes.ok) throw new Error("Repositório ou arquivo não encontrado.");
        const fileData = await fileRes.json();
        
        // 2. Decodificar conteúdo atual
        let content = decodeURIComponent(escape(atob(fileData.content)));

        // 3. Substituir o bloco `let dados = [...]` pelo novo
        const jsonDados = JSON.stringify(novosDados, null, 8);
        content = content.replace(/let dados = \[[\s\S]*?\];/, `let dados = ${jsonDados};`);

        // 4. Enviar PUT de atualização
        const putRes = await fetch(url, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                message: "Atualização de moradores via painel web",
                content: btoa(unescape(encodeURIComponent(content))),
                sha: fileData.sha
            })
        });

        if (!putRes.ok) throw new Error("Falha ao salvar no GitHub.");
    }

    // Configurações do GitHub (Opcional)
    const toggleConfig = document.getElementById('toggleConfig');
    const configSection = document.getElementById('configSection');
    const ghRepoInput = document.getElementById('ghRepo');
    const ghTokenInput = document.getElementById('ghToken');
    const btnSaveConfig = document.getElementById('btnSaveConfig');

    ghRepoInput.value = localStorage.getItem('bahamas_gh_repo') || '';
    ghTokenInput.value = localStorage.getItem('bahamas_gh_token') || '';

    toggleConfig.addEventListener('click', () => {
        configSection.style.display = configSection.style.display === 'block' ? 'none' : 'block';
    });

    btnSaveConfig.addEventListener('click', () => {
        localStorage.setItem('bahamas_gh_repo', ghRepoInput.value.trim());
        localStorage.setItem('bahamas_gh_token', ghTokenInput.value.trim());
        alert('Configurações salvas!');
        configSection.style.display = 'none';
    });
</script>

</body>
</html>
